# Builds the Android APK and publishes the LIVE website on every push to main.
#  • APK  → https://<user>.github.io/bcs-prep/downloads/TIS-BCS-Prep.apk
#           and the latest GitHub Release (TIS-BCS-Prep.apk)
#  • Site → https://<user>.github.io/bcs-prep/   (public, no login needed)
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Build APK & Deploy LIVE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # create the APK release
  pages: write      # deploy GitHub Pages
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle the web app inside the Android app
        run: |
          mkdir -p android/app/src/main/assets/www
          rsync -a --exclude '.git' --exclude '.github' --exclude 'android' --exclude 'downloads' --exclude '_site' ./ android/app/src/main/assets/www/

      # The signing key lives only in GitHub Secrets (never in the repo).
      # Without the secrets a temporary key is used: the APK works, but a new
      # build can't be installed over an old one without uninstalling first.
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p android/keystore
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > android/keystore/tis-release.jks
            echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "Using the permanent signing key from repository secrets."
          else
            TMP_PASS=$(openssl rand -hex 16)
            echo "::add-mask::$TMP_PASS"
            keytool -genkeypair -keystore android/keystore/tis-release.jks -storetype JKS -alias tis \
              -keyalg RSA -keysize 2048 -validity 10950 -dname "CN=TIS Academy, C=BD" \
              -storepass "$TMP_PASS" -keypass "$TMP_PASS"
            echo "KEYSTORE_PASSWORD=$TMP_PASS" >> "$GITHUB_ENV"
            echo "::warning::Signing secrets not set - using a temporary key. Add ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD in Settings > Secrets and variables > Actions so updates install over older versions."
          fi

      - name: Build signed APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Assemble LIVE site with the APK
        run: |
          mkdir -p _site/downloads
          rsync -a --exclude '.git' --exclude '.github' --exclude 'android' --exclude '_site' ./ _site/
          cp android/app/build/outputs/apk/release/app-release.apk _site/downloads/TIS-BCS-Prep.apk
          touch _site/.nojekyll
          rm -f android/keystore/tis-release.jks
          ls -la _site/downloads

      - name: Keep APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TIS-BCS-Prep-apk
          path: _site/downloads/TIS-BCS-Prep.apk

      - name: Publish APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: TIS BCS Prep — Android v3.1.${{ github.run_number }}
          body: |
            Android app for TIS Academy — BCS Preparation & MCQ Platform.
            Download **TIS-BCS-Prep.apk**, open it on your phone and allow "Install unknown apps" if asked.
            LIVE web version: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          files: _site/downloads/TIS-BCS-Prep.apk
          make_latest: true

      - name: Upload site for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
